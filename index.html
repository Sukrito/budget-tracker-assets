        <div class="flex items-center justify-between gap-2 mb-3"><div><h2 class="font-semibold text-slate-900 text-sm">รายการล่าสุด</h2><p class="text-xs text-slate-400">แก้ไขหรือลบรายการย้อนหลังได้จากที่นี่</p></div><button type="button" onclick="loadRecentTransactions()" class="text-xs text-slate-500 hover:text-slate-900">โหลดใหม่</button></div>
        <div id="recent-list" class="space-y-2 text-sm text-slate-600">กำลังโหลด...</div>
      </section>
    </main>

    <main id="page-settings" data-page="settings" class="app-page space-y-4">
      <section class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
        <span class="text-xs text-slate-500 block">Settings</span>
        <h2 class="text-lg font-bold text-slate-900">ตั้งค่าระบบ</h2>
        <p class="text-sm text-slate-500 mt-2">Phase นี้ยังใช้ Settings จาก Google Sheets เดิมก่อน เช่น Categories, Goals, Assets, Plans และ Pay Cycle</p>
        <button type="button" onclick="refreshAll()" class="mt-4 w-full bg-slate-900 text-white rounded-xl py-3 font-medium active:scale-95 transition-transform">Refresh System Data</button>
      </section>
    </main>
  </div>

  <nav class="bottom-nav-shell fixed bottom-0 left-0 right-0 z-30 px-4 pt-2 bg-slate-50/82 backdrop-blur-2xl border-t border-white/70">
    <div class="app-frame mx-auto grid grid-cols-5 gap-1 rounded-3xl bg-white/92 border border-slate-100 shadow-lg p-1">
      <button type="button" data-nav="dashboard" onclick="showPage('dashboard')" class="bottom-nav-btn active rounded-2xl px-2 py-2 text-xs font-medium text-slate-600 transition"><div>⌂</div><span>Home</span></button>
      <button type="button" data-nav="add" onclick="showPage('add')" class="bottom-nav-btn rounded-2xl px-2 py-2 text-xs font-medium text-slate-600 transition"><div>＋</div><span>Add</span></button>
      <button type="button" data-nav="plan" onclick="showPage('plan')" class="bottom-nav-btn rounded-2xl px-2 py-2 text-xs font-medium text-slate-600 transition"><div>▤</div><span>Plan</span></button>
      <button type="button" data-nav="history" onclick="showPage('history')" class="bottom-nav-btn rounded-2xl px-2 py-2 text-xs font-medium text-slate-600 transition"><div>▥</div><span>History</span></button>
      <button type="button" data-nav="settings" onclick="showPage('settings')" class="bottom-nav-btn rounded-2xl px-2 py-2 text-xs font-medium text-slate-600 transition"><div>⚙</div><span>More</span></button>
    </div>
  </nav>

  <div id="editTxModal" class="hidden fixed inset-0 z-40 modal-backdrop bg-slate-900/40 px-4 py-6 overflow-y-auto">
    <div class="max-w-md mx-auto bg-white rounded-3xl shadow-xl border border-slate-100 p-5">
      <div class="flex items-start justify-between gap-3 mb-4"><div><span class="text-xs text-indigo-600 font-medium block">Edit Transaction</span><h2 class="text-lg font-bold text-slate-900">แก้ไขรายการย้อนหลัง</h2><p id="editTxMeta" class="text-xs text-slate-400 mt-1">-</p></div><button type="button" onclick="closeEditTransactionModal()" class="w-9 h-9 rounded-xl bg-slate-100 text-slate-500">✕</button></div>
      <form id="editTxForm" onsubmit="handleEditTransactionSubmit(event)" class="space-y-3">
        <input type="hidden" id="editTxId" name="transactionId">
        <input type="hidden" id="editTxType" name="type">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2"><div><label class="block text-xs font-medium text-slate-500 mb-1">วันที่</label><input id="editTxDate" name="date" type="date" required class="w-full border border-indigo-100 bg-white/90 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"></div><div><label class="block text-xs font-medium text-slate-500 mb-1">จำนวนเงิน</label><input enterkeyhint="done" autocomplete="off" data-number-input="true" pattern="[0-9]*[.,]?[0-9]*" inputmode="decimal" id="editTxAmount" name="amount" type="text" step="any" min="0" required class="w-full border border-indigo-100 bg-white/90 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"></div></div>
        <div><label class="block text-xs font-medium text-slate-500 mb-1">หมวดหมู่</label><input id="editTxCategory" name="category" type="text" required class="w-full border border-indigo-100 bg-white/90 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"></div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2"><div><label class="block text-xs font-medium text-slate-500 mb-1">Item / Goal / Asset</label><input id="editTxItem" name="item" type="text" list="editTxItemOptions" class="w-full border border-indigo-100 bg-white/90 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"><datalist id="editTxItemOptions"></datalist><p id="editTxItemHint" class="text-[11px] text-slate-400 mt-1">เลือกชื่อให้ตรงกับชนิดรายการ</p></div><div><label class="block text-xs font-medium text-slate-500 mb-1">Action</label><select id="editTxAction" name="action" class="w-full border border-indigo-100 bg-white/90 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"></select><p id="editTxActionHint" class="text-[11px] text-slate-400 mt-1">ระบบจะกัน Action ที่ไม่ตรงประเภท</p></div></div>
        <div><label class="block text-xs font-medium text-slate-500 mb-1">บันทึกเพิ่มเติม</label><input id="editTxNote" name="note" type="text" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"></div>
        <div class="grid grid-cols-2 gap-2 pt-2"><button type="button" onclick="closeEditTransactionModal()" class="rounded-xl py-3 bg-slate-100 text-slate-600 font-medium active:scale-95 transition">ยกเลิก</button><button id="editTxSaveButton" type="submit" class="rounded-xl py-3 bg-slate-900 text-white font-medium active:scale-95 transition">บันทึกการแก้ไข</button></div>
      </form>
    </div>
  </div>

  <div id="toast" class="hidden"></div>
  <script src="script.js" defer></script>
</body>
</html>
