<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Budget Tracker</title>

  <!-- iPhone / PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">

  <!-- App Icon -->
  <link
    rel="apple-touch-icon"
    href="https://cdn.jsdelivr.net/gh/Sukrito/budget-tracker-assets@main/icon-v2.png?v=2"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- JS -->
  <script defer src="script.js"></script>
</head>

<body class="bg-slate-950 text-white min-h-screen">

  <!-- Background Glow -->
  <div class="fixed inset-0 overflow-hidden -z-10">
    <div class="absolute top-[-120px] left-[-120px] w-[300px] h-[300px] bg-cyan-500/20 blur-3xl rounded-full"></div>
    <div class="absolute bottom-[-120px] right-[-120px] w-[300px] h-[300px] bg-blue-500/20 blur-3xl rounded-full"></div>
  </div>

  <!-- Header -->
  <header class="sticky top-0 z-50 backdrop-blur-xl bg-slate-900/70 border-b border-white/10">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">

      <div>
        <p class="text-xs uppercase tracking-[0.25em] text-cyan-300">
          Personal Finance
        </p>

        <h1 class="text-2xl font-bold">
          Budget Tracker
        </h1>
      </div>

      <button
        onclick="refreshData()"
        class="bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-semibold px-4 py-2 rounded-xl transition"
      >
        Refresh
      </button>

    </div>
  </header>

  <!-- Main -->
  <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

    <!-- Balance -->
    <section class="bg-white/5 border border-white/10 rounded-3xl p-6 backdrop-blur-xl shadow-2xl">

      <p class="text-sm text-slate-400">
        Current Balance
      </p>

      <h2 id="balanceText" class="text-4xl font-black mt-2">
        ฿0
      </h2>

      <div class="mt-5 grid grid-cols-2 gap-4">

        <div class="bg-emerald-500/10 border border-emerald-400/20 rounded-2xl p-4">
          <p class="text-sm text-emerald-300">
            Income
          </p>

          <p id="incomeText" class="text-2xl font-bold mt-1">
            ฿0
          </p>
        </div>

        <div class="bg-rose-500/10 border border-rose-400/20 rounded-2xl p-4">
          <p class="text-sm text-rose-300">
            Expense
          </p>

          <p id="expenseText" class="text-2xl font-bold mt-1">
            ฿0
          </p>
        </div>

      </div>

    </section>

    <!-- Add Transaction -->
    <section class="bg-white/5 border border-white/10 rounded-3xl p-6 backdrop-blur-xl shadow-2xl">

      <h3 class="text-xl font-bold mb-5">
        Add Transaction
      </h3>

      <div class="space-y-4">

        <input
          id="titleInput"
          type="text"
          placeholder="รายการ"
          class="w-full bg-slate-900/70 border border-white/10 rounded-2xl px-4 py-3 outline-none focus:border-cyan-400"
        >

        <input
          id="amountInput"
          type="number"
          placeholder="จำนวนเงิน"
          class="w-full bg-slate-900/70 border border-white/10 rounded-2xl px-4 py-3 outline-none focus:border-cyan-400"
        >

        <div class="grid grid-cols-2 gap-4">

          <button
            onclick="addIncome()"
            class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-2xl transition"
          >
            + Income
          </button>

          <button
            onclick="addExpense()"
            class="bg-rose-500 hover:bg-rose-400 text-white font-bold py-3 rounded-2xl transition"
          >
            - Expense
          </button>

        </div>

      </div>

    </section>

    <!-- Transactions -->
    <section class="bg-white/5 border border-white/10 rounded-3xl p-6 backdrop-blur-xl shadow-2xl">

      <div class="flex items-center justify-between mb-5">

        <h3 class="text-xl font-bold">
          Recent Transactions
        </h3>

        <span class="text-sm text-slate-400">
          Latest Activity
        </span>

      </div>

      <div id="transactionList" class="space-y-3">

        <!-- JS Render -->

      </div>

    </section>

  </main>

</body>
</html>
